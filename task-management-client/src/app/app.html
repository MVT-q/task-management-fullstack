<form (ngSubmit)="login()">
  <input 
    type="text" 
    name="username" 
    [(ngModel)]="username" 
    placeholder="Username">

  <input 
    type="password" 
    name="password" 
    [(ngModel)]="password" 
    placeholder="Password">

  <button type="submit">Login</button>

  <button type="button" (click)="getProjects()">Get projects</button>
</form>
