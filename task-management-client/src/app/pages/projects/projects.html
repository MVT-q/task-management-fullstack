<button type="button" (click)="logout()">Logout</button>

<form (ngSubmit)="createProject()">
  <input 
    type="text" 
    name="name" 
    [(ngModel)]="projectName" 
    placeholder="Project name">

  <input
    type="text"
    name="description"
    [(ngModel)]="projectDescription"
    placeholder="Project description">

  <button type="submit">Create project</button>
</form>

@for (project of projects; track project.id) {
  @if (editingProjectId === project.id) {
    <input
      type="text"
      name="editName"
      [(ngModel)]="editingName">
    
    <input
      type="text"
      name="editDescription"
      [(ngModel)]="editingDescription">
    
    <button type="button" (click)="saveProject(project.id)">Save</button>
    
    <button type="button" (click)="cancelEdit()">Cancel</button>
  }

  @else {
    <div>
      <h2>{{ project.name }}</h2>
      <p>{{ project.description }}</p>
  
      <button type="button"(click)="startEdit(project)">Edit</button>
  
      <button type="button" (click)="deleteProject(project.id)">Delete</button>
    </div>
  }
}
