<div class="page projects-page">
  <div class="page-header">
    <h1>My projects</h1>

    <button class="button button-secondary" type="button" (click)="logout()">Logout</button>
  </div>

  <section class="card">
    <h2>Create project</h2>

    <form class="form" (ngSubmit)="createProject()">
      <label for="project-name">Project name</label>
      <input
        id="project-name"
        class="input"
        type="text"
        name="name"
        [(ngModel)]="projectName"
        placeholder="Project name"
        required
      />

      <label for="project-description">Description</label>
      <textarea
        id="project-description"
        class="input textarea"
        name="description"
        [(ngModel)]="projectDescription"
        placeholder="Project description"
        rows="3"
      ></textarea>

      <button class="button button-primary" type="submit">Create project</button>
    </form>
  </section>

  <section class="projects-list">
    @for (project of projects; track project.id) {
      <article class="card project-card">
        @if (editingProjectId === project.id) {
          <h2>Edit project</h2>

          <div class="form">
            <label for="edit-project-name">Project name</label>
            <input
              id="edit-project-name"
              class="input"
              type="text"
              name="editName"
              [(ngModel)]="editingName"
            />

            <label for="edit-project-description">Description</label>
            <textarea
              id="edit-project-description"
              class="input textarea"
              name="editDescription"
              [(ngModel)]="editingDescription"
              rows="3"
            ></textarea>

            <div class="button-row">
              <button class="button button-primary" type="button" (click)="saveProject(project.id)">
                Save
              </button>

              <button class="button button-secondary" type="button" (click)="cancelEdit()">
                Cancel
              </button>
            </div>
          </div>
        } @else {
          <h2>{{ project.name }}</h2>
          <p class="muted">{{ project.description }}</p>

          <div class="button-row">
            <button class="button button-primary" type="button" (click)="openProject(project.id)">
              Open
            </button>

            <button class="button button-secondary" type="button" (click)="startEdit(project)">
              Edit
            </button>

            <button class="button button-danger" type="button" (click)="deleteProject(project.id)">
              Delete
            </button>
          </div>
        }
      </article>
    }
  </section>
</div>
