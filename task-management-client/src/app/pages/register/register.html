<form (ngSubmit)="register()">
  <input 
    type="text" 
    name="username" 
    [(ngModel)]="username" 
    placeholder="Username">

  <input 
    type="password" 
    name="password" 
    [(ngModel)]="password" 
    placeholder="Password">

  <button type="submit">Register</button>
</form>
<button type="button" (click)="toLogin()">Already have account</button>
