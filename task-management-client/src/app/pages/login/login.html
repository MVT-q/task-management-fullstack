<div class="auth-page">
  <div class="auth-card">
    <h1>Login</h1>

    <form class="auth-form" (ngSubmit)="login()">
      <label for="login-username">Username</label>
      <input
        id="login-username"
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Username"
        required
      />

      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Password"
        required
      />

      <button class="button button-primary" type="submit">Login</button>
    </form>

    <button class="button button-link" type="button" (click)="toCreateAccount()">
      Create account
    </button>
  </div>
</div>
