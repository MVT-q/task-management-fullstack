<div class="page project-details-page">
  @if (project) {
    <header class="project-header">
      <h1>{{ project.name }}</h1>
      <p class="muted">{{ project.description }}</p>
    </header>

    <section class="card">
      <app-project-members [projectId]="projectId" />
    </section>

    <section class="card">
      <app-project-tasks [projectId]="projectId" />
    </section>
  }
</div>
