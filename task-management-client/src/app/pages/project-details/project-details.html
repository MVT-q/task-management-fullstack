@if (project) {
  <h1>{{ project.name }}</h1>

  <p>{{ project.description }}</p>

  <button type="button" (click)="toggleMembers()">
    {{ showMembers ? 'Hide members' : 'Show members' }}
  </button>

  @if (showMembers) {
    @if (members.length > 0) {
      <h2>Members</h2>

      @for (member of members; track member.userId) {
        <div>
          <span> {{ member.username }} — Role: {{ member.role }} </span>

          <button type="button" (click)="removeMember(member.userId)">Remove</button>
        </div>
      }
    } @else {
      <p>No members found</p>
    }
  }

  <input type="number" name="userId" [(ngModel)]="newMemberUserId" placeholder="User ID" />

  <button type="button" (click)="addMember()">Add member</button>
}
